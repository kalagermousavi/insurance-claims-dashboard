<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClaimFlow Login</title>
    <link rel="stylesheet" href="./assets/css/output.css" />
  </head>
  <body class="bg-slate-100 min-h-screen flex items-center justify-center">
    <!-- Login Container Start -->

    <main class="w-full flex justify-center">
      <!-- Login Card Start -->

      <section class="bg-white rounded-2xl shadow-sm p-8 w-full max-w-md">
        <h1 class="text-3xl font-bold text-slate-900 text-center mb-2">
          ClaimFlow
        </h1>

        <p class="text-sm text-slate-500 text-center mb-8">
          Insurance Dashboard Login
        </p>

        <!-- Login Form Start -->

        <form class="space-y-4">
          <label class="block text-sm font-medium text-slate-700">
            Email
          </label>

          <input
            type="email"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-900"
          />

          <label class="block text-sm font-medium text-slate-700">
            Password
          </label>

          <input
            type="password"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-900"
          />

          <button
            class="w-full bg-slate-900 text-white py-3 rounded-xl font-medium hover:bg-slate-700 transition"
          >
            Login
          </button>
        </form>

        <!-- Login Form End -->
      </section>

      <!-- Login Card End -->
    </main>

    <!-- Login Container End -->
  </body>
</html>
